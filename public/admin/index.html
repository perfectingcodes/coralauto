<!-- Login -->
<div id="login" class="login" hidden>
  <form class="login__card" id="login-form" autocomplete="on">
    <img class="login__logo" src="/assets/img/logo.webp" alt="Coral Auto Spa" width="120" height="120">
    <h1 class="login__title">Admin portal</h1>
    <p class="login__sub">Sign in to manage jobs, customers and the calendar.</p>
    <label class="field">
      <span class="field__label">Password</span>
      <input class="field__input" type="password" name="password" id="login-password" autocomplete="current-password" required autofocus>
    </label>
    <p class="login__error" id="login-error" role="alert" hidden></p>
    <button class="btn btn--primary btn--block" type="submit" id="login-submit">Sign in</button>
    <a class="login__back" href="/">← Back to the website</a>
  </form>
</div>

<!-- App shell -->
<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <img src="/assets/img/logo.webp" alt="" width="44" height="44">
      <div>
        <strong>Coral Auto Spa</strong>
        <span>Admin portal</span>
      </div>
      <button class="iconbtn sidebar__close" type="button" id="nav-close" aria-label="Close menu"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="sidebar__foot">
      <a class="nav__link" href="/" target="_blank" rel="noopener"><svg class="ic"><use href="#i-external"/></svg><span>View website</span></a>
      <button class="nav__link" type="button" id="logout"><svg class="ic"><use href="#i-logout"/></svg><span>Sign out</span></button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn topbar__menu" type="button" id="nav-open" aria-label="Open menu"><svg class="ic"><use href="#i-menu"/></svg></button>
      <div class="topbar__title" id="page-title">Dashboard</div>
      <label class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input type="search" id="global-search" placeholder="Search customers, jobs, directory…" autocomplete="off">
      </label>
      <button class="btn btn--primary topbar__add" type="button" id="quick-add"><svg class="ic"><use href="#i-plus"/></svg><span>New</span></button>
    </header>
    <div class="banner" id="dev-banner" hidden>
      <svg class="ic"><use href="#i-alert"/></svg>
      <span>Running with the development password. Set <code>ADMIN_PASSWORD</code> before this goes live.</span>
    </div>
    <main class="content" id="view"></main>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <header class="modal__head">
      <h2 id="modal-title">Edit</h2>
      <button class="iconbtn" type="button" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div class="modal__body" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="quickmenu" id="quickmenu" hidden></div>

<script src="/admin/admin.js?v=2"></script>
</body>
</html>
